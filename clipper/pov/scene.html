<!doctype html>
<html><head><meta charset="utf-8"><title>pov</title>
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Arial Black","Segoe UI Emoji",Arial,sans-serif}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
  #under{background:radial-gradient(ellipse at 50% 45%,rgba(0,40,60,0) 30%,rgba(0,30,48,.75) 100%);opacity:0}
  #flash{background:#e8f0ff;opacity:0}
  #vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
  .stroke{color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.35)}
  #hud{position:absolute;left:44px;top:228px;font-size:38px;line-height:1.25}
  #hud .place{color:#fff}
  #hud .clock{color:#ffd54a}
  #alert{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:10px;background:#e01e1e;color:#fff;font-size:30px;-webkit-text-stroke:0}
  #timer{position:absolute;left:0;width:1080px;top:224px;text-align:center}
  #timer span{display:inline-block;padding:6px 30px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:64px;border:5px solid #fff}
  #timer span.low{background:#d31c1c}
  #part{position:absolute;right:44px;top:236px;padding:8px 18px;border-radius:10px;background:#ffd54a;color:#111;font-size:32px}
  #meter{position:absolute;right:52px;top:640px;width:46px;height:560px;border:5px solid #fff;border-radius:28px;background:rgba(0,0,0,.45);overflow:hidden}
  #fill{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(#5fd3f3,#1b7fa8)}
  #mlabel{position:absolute;right:6px;top:1214px;width:140px;text-align:center;font-size:30px;white-space:nowrap}
  #hook{position:absolute;left:40px;width:1000px;top:420px;text-align:center;font-size:104px;line-height:1.05;color:#ffd54a}
  #cap{position:absolute;left:40px;width:1000px;top:1110px;text-align:center;font-size:96px;line-height:1.05}
  #cap.shout{color:#ff4a4a}
  #choice{position:absolute;left:0;top:0;width:1080px;height:1920px;background:rgba(5,8,18,.62);opacity:0}
  #q{position:absolute;left:20px;width:1040px;top:500px;text-align:center;font-size:80px;color:#fff;white-space:nowrap}
  .btn{position:absolute;left:110px;width:860px;height:210px;border-radius:40px;display:flex;align-items:center;justify-content:center;
       font-size:84px;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;border:8px solid #fff;box-shadow:0 14px 0 rgba(0,0,0,.45)}
  #ba{top:700px;background:#1e88e5}
  #bb{top:970px;background:#ff6d00}
  #q.win{color:#4ef07a;font-size:104px}
  #choice.small .btn{font-size:62px;text-align:center;line-height:1.1;padding:0 30px;box-sizing:border-box}
  #choice.win .btn{font-size:58px;text-align:center;line-height:1.1;padding:0 30px;box-sizing:border-box}
  #foot{position:absolute;left:60px;width:960px;top:1250px;text-align:center;font-size:50px;line-height:1.2;color:#ffd54a}
  #thumbtxt{position:absolute;left:30px;width:1020px;top:330px;text-align:center;font-size:150px;line-height:1.0;color:#ffd54a;display:none}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ov" id="under"></div>
<div class="ov" id="flash"></div>
<div class="ov" id="vig"></div>
<div id="hud" class="stroke"><div class="place">📍 <span id="place"></span></div><div class="clock" id="clock"></div><div id="alert"></div></div>
<div id="timer" class="stroke"><span id="tval">0:40</span></div>
<div id="part" class="">PART 1</div>
<div id="meter"><div id="fill"></div></div>
<div id="mlabel" class="stroke">WATER<br><span id="mval">0.1 FT</span></div>
<div id="hook" class="stroke"></div>
<div id="cap" class="stroke"></div>
<div id="choice"><div id="q" class="stroke"></div><div class="btn" id="ba"></div><div class="btn" id="bb"></div><div id="foot" class="stroke"></div></div>
<div id="thumbtxt" class="stroke"></div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";
const q = new URLSearchParams(location.search);
const name = q.get("ep") || "pov-ep01";
const spec = await (await fetch(`build/${name}/page.json`)).json();
const { buildWorld, buildArms, update } = await import("./" + (spec.module || "flood.js"));
const FPS = spec.fps || 30;
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const W = buildWorld(spec);
const cam = new THREE.PerspectiveCamera(62, 1080 / 1920, 0.05, 400);
W.scene.add(cam);
const arms = buildArms(cam, spec);
cam.add(W.bubbles);

$("place").textContent = spec.hud.place;
$("alert").textContent = "⚠ " + spec.hud.alert;
$("part").textContent = spec.partLabel || "PART " + (spec.part || 1);
$("q").textContent = spec.choice.q; $("ba").textContent = spec.choice.a; $("bb").textContent = spec.choice.b;
$("foot").textContent = spec.choice.foot;
if (spec.choice.win) { $("q").className = "stroke win"; $("choice").className = "win"; }
if (spec.choice.small) $("choice").className = "small";
if (!spec.choice.a) $("ba").style.display = "none";
if (!spec.choice.b) $("bb").style.display = "none";
const thumb = q.get("thumb");
if (thumb) {
  const el = $("thumbtxt"); el.style.display = "block"; el.innerHTML = thumb;
  for (let fs = 150; fs > 60 && el.scrollWidth > 1020; fs -= 6) { el.style.fontSize = fs + "px"; el.style.whiteSpace = "nowrap"; }
  el.style.whiteSpace = "";
}

const pop = (dt, d = 0.12) => dt < d ? 1.18 - 0.18 * (dt / d) : 1;

function overlay(t, info) {
  const clock = spec.hud.clock.filter(c => c[0] <= t).pop();
  $("clock").textContent = clock ? clock[1] : "";
  $("alert").style.visibility = Math.floor(t * 2) % 2 === 0 ? "visible" : "hidden";
  const left = Math.max(0, Math.ceil((spec.hud.countdown || 0) - t));
  $("tval").textContent = `0:${String(left).padStart(2, "0")}`;
  $("tval").className = left <= 10 ? "low" : "";
  $("timer").style.display = spec.hud.countdown && t < spec.choice.t0 && !thumb ? "block" : "none";
  const ft = info.L * 3.28;
  $("fill").style.height = `${Math.min(100, info.L / 4.1 * 100)}%`;
  $("mval").textContent = `${ft.toFixed(1)} FT`;
  $("under").style.opacity = info.under ? 1 : 0;
  $("flash").style.opacity = info.under ? 0 : info.flash * 0.35;
  const h = spec.hooks.find(h => t >= h.t0 && t < h.t1);
  $("hook").textContent = h && !thumb ? h.text : "";
  $("hook").style.transform = h ? `scale(${pop(t - h.t0, 0.15)})` : "";
  const w = (spec.words || []).find(w => t >= w.s && t < w.e);
  $("cap").textContent = w && !thumb ? w.w : "";
  $("cap").className = "stroke" + (w && w.who !== "narr" ? " shout" : "");
  $("cap").style.transform = w ? `scale(${pop(t - w.s)})` : "";
  $("cap").style.top = (spec.choice.win || spec.choice.small) && t >= spec.choice.t0 ? "1420px" : "";
  const c = t - spec.choice.t0;
  $("choice").style.opacity = c >= 0 ? Math.min(1, c / 0.3) : 0;
  $("ba").style.transform = `translateX(${c < 0.35 ? -1200 * (1 - Math.max(0, c) / 0.35) : 0}px) scale(${c > 0.4 ? 1 + 0.03 * Math.sin(c * 6) : 1})`;
  $("bb").style.transform = `translateX(${c < 0.65 ? 1200 * (1 - Math.max(0, c - 0.3) / 0.35) : 0}px) scale(${c > 0.7 ? 1 + 0.03 * Math.sin(c * 6 + 1.5) : 1})`;
  const hideUi = !!thumb || c >= 0;
  for (const id of ["hud", "meter", "mlabel"]) $(id).style.display = hideUi || (id !== "hud" && spec.hud.meter === false) ? "none" : "block";
  $("part").style.display = thumb ? "none" : "block";
}

window.renderFrame = async n => {
  const t = n / FPS;
  const info = update(W, cam, arms, t, spec);
  overlay(t, info);
  renderer.render(W.scene, cam);
  await new Promise(r => requestAnimationFrame(() => r()));
  window.__last = info;
  return info;
};
window.__info = { name, fps: FPS, gpu: (() => { const gl = renderer.getContext(); const e = gl.getExtension("WEBGL_debug_renderer_info"); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : "?"; })() };
window.__ready = true;
</script>
</body></html>
